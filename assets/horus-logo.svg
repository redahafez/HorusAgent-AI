<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 300" width="100%" height="100%">
  <defs>
    <!-- Dark Titanium Cosmic Card Gradient -->
    <linearGradient id="titaniumBackdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="35%" stop-color="#0a1426"/>
      <stop offset="70%" stop-color="#080f1e"/>
      <stop offset="100%" stop-color="#02050b"/>
    </linearGradient>

    <!-- Multi-Chroma Glowing Border Gradient -->
    <linearGradient id="neonCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 24K Royal Egyptian Solar Gold for HORUS -->
    <linearGradient id="horusRoyalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Electric Cyan Plasma for AGENT -->
    <linearGradient id="agentElectricCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="25%" stop-color="#bae6fd"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- AI Cyber Pill Gradient -->
    <linearGradient id="aiPillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Iris Gradient -->
    <radialGradient id="miniQuantumIris" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Spiral Chroma Gradient -->
    <linearGradient id="miniSpiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neonGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardDropShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Enclosed Luxury Glassmorphic Shield Card Plate -->
  <g filter="url(#cardDropShadow)">
    <rect x="6" y="6" width="1138" height="288" rx="32" fill="url(#titaniumBackdrop)" stroke="url(#neonCardBorder)" stroke-width="2.2"/>
    <rect x="16" y="16" width="1118" height="268" rx="24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="8 12"/>
  </g>

  <!-- Cybernetic Grid Scanlines & Coordinates (Subtle Watermark) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="30" y1="75" x2="1120" y2="75"/>
    <line x1="30" y1="150" x2="1120" y2="150"/>
    <line x1="30" y1="225" x2="1120" y2="225"/>
    <line x1="320" y1="20" x2="320" y2="280"/>
    <line x1="650" y1="20" x2="650" y2="280"/>
    <line x1="940" y1="20" x2="940" y2="280"/>
  </g>

  <!-- Tech Telemetry Micro-Notations -->
  <g opacity="0.4" font-family="monospace" font-size="8" fill="#38bdf8" letter-spacing="1">
    <text x="32" y="32">[SYS::HORUS_AI_V2]</text>
    <text x="1030" y="32">[RAG::128-DIM]</text>
    <text x="32" y="278">[STATUS::ALL_SEEING]</text>
    <text x="1015" y="278">[SWARM::COGNITIVE]</text>
  </g>

  <!-- Ambient Radiant Halo Behind Eye Emblem -->
  <circle cx="160" cy="150" r="110" fill="#0284c7" opacity="0.12" filter="url(#neonGlowEffect)"/>

  <!-- 2. Cybernetic Eye of Horus Emblem (Left) -->
  <g transform="translate(35, 22) scale(0.43)">
    <!-- Radar Rings -->
    <circle cx="300" cy="270" r="230" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 14" opacity="0.35"/>
    <circle cx="300" cy="270" r="190" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 20" opacity="0.35"/>

    <!-- Winged Solar Crest (Sun Disk of Ra) -->
    <g transform="translate(0, -10)">
      <circle cx="300" cy="95" r="22" fill="url(#horusRoyalGold)" filter="url(#goldTextGlow)"/>
      <circle cx="300" cy="95" r="7" fill="#ffffff"/>
      <path d="M 300 68 L 300 48" stroke="url(#horusRoyalGold)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 275 75 L 260 58" stroke="url(#horusRoyalGold)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 325 75 L 340 58" stroke="url(#horusRoyalGold)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Falcon Sky Wings -->
      <path d="M 230 115 C 170 115 110 135 60 175 C 110 160 175 152 235 145 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
      <path d="M 370 115 C 430 115 490 135 540 175 C 490 160 425 152 365 145 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Brow of Horus (Pharaonic Gold Segmented Beam) -->
    <path d="M 105 195 C 185 135 415 135 495 195 C 425 170 300 160 180 178 C 145 184 125 189 105 195 Z" 
          fill="url(#horusRoyalGold)" filter="url(#goldTextGlow)"/>
    <path d="M 135 187 C 205 154 395 154 460 187" 
          fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 8 28 8"/>
    <circle cx="105" cy="195" r="7" fill="#fbbf24"/>
    <circle cx="495" cy="195" r="7" fill="#fbbf24"/>

    <!-- Upper Eyelid (Electric Cyan Neon Beam) -->
    <path d="M 115 240 Q 300 150 485 240" 
          fill="none" stroke="url(#agentElectricCyan)" stroke-width="16" stroke-linecap="round" filter="url(#neonGlowEffect)"/>
    <path d="M 125 238 Q 300 156 475 238" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Lower Eyelid (Curved Aerodynamic Rail) -->
    <path d="M 115 240 Q 300 375 485 240" 
          fill="none" stroke="url(#agentElectricCyan)" stroke-width="11" stroke-linecap="round" filter="url(#neonGlowEffect)"/>
    <path d="M 130 242 Q 300 366 470 242" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>

    <!-- Inner Sclera Circuit Grid -->
    <path d="M 165 240 Q 300 320 435 240" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

    <!-- Iris & Quantum AI Core -->
    <g transform="translate(300, 260)">
      <circle cx="0" cy="0" r="68" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 8 14 8" filter="url(#neonGlowEffect)"/>
      <circle cx="0" cy="0" r="60" fill="none" stroke="url(#horusRoyalGold)" stroke-width="2" opacity="0.8"/>
      <!-- Aperture Teeth -->
      <polygon points="0,-54 28,-38 18,-12 -8,-24" fill="#0b172a" stroke="#0284c7" stroke-width="1"/>
      <polygon points="38,-28 54,0 24,8 12,-18" fill="#08101f" stroke="#0284c7" stroke-width="1"/>
      <polygon points="54,0 38,28 12,18 24,-8" fill="#0b172a" stroke="#0284c7" stroke-width="1"/>
      <polygon points="28,38 0,54 -8,24 18,12" fill="#08101f" stroke="#0284c7" stroke-width="1"/>
      <polygon points="0,54 -28,38 -18,12 8,24" fill="#0b172a" stroke="#0284c7" stroke-width="1"/>
      <polygon points="-38,28 -54,0 -24,-8 -12,18" fill="#08101f" stroke="#0284c7" stroke-width="1"/>
      <polygon points="-54,0 -38,-28 -12,-18 -24,8" fill="#0b172a" stroke="#0284c7" stroke-width="1"/>
      <polygon points="-28,-38 0,-54 8,-24 -18,-12" fill="#08101f" stroke="#0284c7" stroke-width="1"/>

      <circle cx="0" cy="0" r="48" fill="url(#miniQuantumIris)" stroke="url(#horusRoyalGold)" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Reticle Crosshairs -->
      <line x1="0" y1="-50" x2="0" y2="-26" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="0" y1="26" x2="0" y2="50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-50" y1="0" x2="-26" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="26" y1="0" x2="50" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

      <circle cx="0" cy="0" r="10" fill="#38bdf8" filter="url(#neonGlowEffect)"/>
      <circle cx="-3" cy="-3" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Falcon Teardrop Marking (Vertical Data Bus Column) -->
    <path d="M 300 335 L 300 480 Q 300 515 270 515 L 245 515" 
          fill="none" stroke="url(#horusRoyalGold)" stroke-width="14" stroke-linecap="round" filter="url(#goldTextGlow)"/>
    <path d="M 300 345 L 300 480 Q 300 505 275 505 L 250 505" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="245" cy="515" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>

    <!-- Logarithmic Golden Spiral of Horus (Vector Memory Feather) -->
    <path d="M 210 325 C 165 400 115 470 180 510 C 235 540 285 475 240 425 C 205 395 165 418 175 455 C 185 480 215 475 218 452" 
          fill="none" stroke="url(#miniSpiral)" stroke-width="12" stroke-linecap="round" filter="url(#neonGlowEffect)"/>
    <path d="M 210 325 C 165 400 115 470 180 510 C 235 540 285 475 240 425 C 205 395 165 418 175 455 C 185 480 215 475 218 452" 
          fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="165" cy="405" r="4.5" fill="#38bdf8"/>
    <circle cx="145" cy="475" r="5" fill="#818cf8"/>
    <circle cx="195" cy="520" r="5.5" fill="#c084fc"/>
    <circle cx="218" cy="452" r="6" fill="#fef08a" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Sensor Nodes -->
    <circle cx="115" cy="240" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="485" cy="240" r="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- 3. Brand Typography & Enterprise Architecture Stack (Right Side) -->
  <g transform="translate(305, 118)">
    <!-- Brand Title: HORUS (Solar Gold) -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#horusRoyalGold)" filter="url(#goldTextGlow)">
      HORUS
    </text>

    <!-- Brand Title: AGENT (Electric Cyan) -->
    <text x="256" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#agentElectricCyan)" filter="url(#neonGlowEffect)">
      AGENT
    </text>

    <!-- Luxury AI Cyber Holographic Pill Badge (Safe Offset at x=525 with ZERO overlap!) -->
    <g transform="translate(525, -52)">
      <rect x="0" y="0" width="94" height="60" rx="16" fill="url(#aiPillFill)" stroke="#38bdf8" stroke-width="2.2" filter="url(#neonGlowEffect)"/>
      <rect x="3" y="3" width="88" height="24" rx="12" fill="#ffffff" opacity="0.12"/>
      <text x="47" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="2" fill="#ffffff" text-anchor="middle" filter="url(#neonGlowEffect)">
        AI
      </text>
    </g>

    <!-- Subtitle: Autonomous Multi-Agent Swarm & Vector RAG Intelligence -->
    <text x="4" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4.5" fill="#e2e8f0">
      AUTONOMOUS MULTI-AGENT SWARM &amp; VECTOR RAG INTELLIGENCE
    </text>

    <!-- Pharaonic Precision Tagline with Glowing Gold Elements -->
    <g transform="translate(4, 70)">
      <circle cx="4" cy="-5" r="2.5" fill="#fbbf24" filter="url(#goldTextGlow)"/>
      <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" letter-spacing="2" fill="#f59e0b">
        THE ALL-SEEING EYE OF COGNITIVE PRECISION &amp; ENTERPRISE GOVERNANCE
      </text>
    </g>

    <!-- Executive Enterprise Technology Badges (Feature Pillars) -->
    <g transform="translate(4, 100)">
      <!-- Pill 1: LangGraph Swarm -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-15" width="200" height="28" rx="8" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
        <circle cx="14" cy="-1" r="4" fill="#38bdf8" filter="url(#neonGlowEffect)"/>
        <text x="26" y="3" font-family="monospace" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="1">
          ✦ LANGGRAPH SWARM
        </text>
      </g>

      <!-- Pill 2: 128-Dim Vector RAG -->
      <g transform="translate(212, 0)">
        <rect x="0" y="-15" width="195" height="28" rx="8" fill="rgba(129, 140, 248, 0.12)" stroke="rgba(167, 139, 250, 0.4)" stroke-width="1.2"/>
        <circle cx="14" cy="-1" r="4" fill="#a78bfa" filter="url(#neonGlowEffect)"/>
        <text x="26" y="3" font-family="monospace" font-weight="700" font-size="11" fill="#c4b5fd" letter-spacing="1">
          ⚡ 128-DIM VECTOR RAG
        </text>
      </g>

      <!-- Pill 3: FDA / SOC 2 Compliance -->
      <g transform="translate(419, 0)">
        <rect x="0" y="-15" width="220" height="28" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2"/>
        <circle cx="14" cy="-1" r="4" fill="#10b981" filter="url(#neonGlowEffect)"/>
        <text x="26" y="3" font-family="monospace" font-weight="700" font-size="11" fill="#34d399" letter-spacing="1">
          🛡️ FDA 21 CFR 11 • SOC 2
        </text>
      </g>

      <!-- Pill 4: Anti-Hallucination -->
      <g transform="translate(651, 0)">
        <rect x="0" y="-15" width="170" height="28" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.2"/>
        <circle cx="14" cy="-1" r="4" fill="#f59e0b" filter="url(#goldTextGlow)"/>
        <text x="26" y="3" font-family="monospace" font-weight="700" font-size="11" fill="#fbbf24" letter-spacing="1">
          👁️ ANTI-HALLUCINATION
        </text>
      </g>
    </g>
  </g>
</svg>

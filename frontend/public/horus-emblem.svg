    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="184" height="184" rx="48" fill="url(#emblemBackdrop)" stroke="url(#pharaohGold)" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="18" y="18" width="164" height="164" rx="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <text x="100" y="132" font-size="108" text-anchor="middle" fill="url(#pharaohGold)" filter="url(#goldGlow)" font-family="'Noto Sans Egyptian Hieroglyphs', 'Segoe UI Historic', 'Apple Symbols', sans-serif">𓂀</text>

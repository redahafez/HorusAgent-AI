[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horus-cli"
version = "2.1.0"
description = "HorusAgent-AI Command Line Interface for Enterprise Multi-Agent Swarms & Vector RAG"
authors = [{ name = "Reda Hafez", email = "reda.hafez11@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0.0"]

[project.scripts]
horus = "horus.main:cli"
horus-cli = "horus.main:cli"
